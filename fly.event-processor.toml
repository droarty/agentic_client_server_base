# Deploy from the repo root so the Docker build context includes the whole
# Nx workspace: flyctl deploy --config fly.event-processor.toml
#
# `app` is an unused fallback — CI overrides it with `--app`, sourced from the
# FLY_EVENT_PROCESSOR_APP_NAME GitHub Actions variable (see DEPLOY.md), so
# this doesn't need editing. It still must be a name registered via
# `fly apps create` (app names are globally unique across all Fly customers)
# if you deploy manually without passing `--app`.
#
# Exposed publicly for simplicity at launch — POST /internal/events is
# already bearer-token authenticated (INTERNAL_SERVICE_TOKEN). Once this is
# running, consider switching to Fly's private networking (6PN / flycast,
# reachable at <app-name>.internal from other apps in the same org) and
# dropping the public http_service so the port isn't internet-facing at all.
app = "CHANGE-ME-acsb-event-processor"
primary_region = "iad"

[build]
  dockerfile = "apps/event-processor/Dockerfile"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
