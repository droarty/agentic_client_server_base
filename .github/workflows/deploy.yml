name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  migrate:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && success()
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Drizzle tracks applied migrations, so re-running on every deploy is a
      # safe no-op when there's nothing new — see libs/db-schema/src/migrate.ts.
      - run: pnpm run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    needs: migrate
    if: github.event_name == 'workflow_dispatch' && success()
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.api.toml --app ${{ vars.FLY_API_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-event-processor:
    needs: migrate
    if: github.event_name == 'workflow_dispatch' && success()
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --config fly.event-processor.toml --app ${{ vars.FLY_EVENT_PROCESSOR_APP_NAME }} --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_EVENT_PROCESSOR_TOKEN }}

  deploy-web:
    needs: build-and-test
    if: github.event_name == 'workflow_dispatch' && success()
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx build web
        env:
          API_URL: ${{ vars.WEB_API_URL }}
          WS_URL: ${{ vars.WEB_WS_URL }}
      - run: pnpm exec wrangler deploy --config apps/web/wrangler.jsonc --name ${{ vars.CLOUDFLARE_WORKER_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
